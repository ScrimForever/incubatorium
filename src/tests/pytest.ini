[pytest]
# -*- coding: utf-8 -*-
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
asyncio_mode = auto
addopts = -v --strict-markers --tb=short
markers =
    asyncio: marca testes que usam async/await (deselect com '-m "not asyncio"')
    slow: marca testes como lentos (deselect com '-m "not slow"')
    integration: marca testes de integração (deselect com '-m "not integration"')
