<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ titulo }}</title>
</head>
<body style="margin:0; padding:0; background:#4A8570; font-family:Arial, Helvetica, sans-serif;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#4A8570; background-image:linear-gradient(135deg, #3B6FA8 0%, #3E7B8C 35%, #4C9179 65%, #6FAD5E 100%); padding:48px 16px;">
  <tr>
    <td align="center">
      <table role="presentation" width="480" cellpadding="0" cellspacing="0" style="max-width:480px; width:100%; background:#ffffff; border-radius:20px; overflow:hidden; box-shadow:0 25px 60px rgba(0,0,0,0.22);">
        <tr>
          <td style="background-color:#2E6DA4; background-image:linear-gradient(120deg, #2E6DA4 0%, #337A94 100%); padding:28px 32px;">
            <span style="color:#ffffff; font-size:20px; font-weight:bold; letter-spacing:0.3px;">TEC INCUBADORA</span>
          </td>
        </tr>
        <tr>
          <td style="padding:36px 32px 12px;">
            <h1 style="margin:0 0 14px; font-size:22px; line-height:1.3; color:#1f2d3d;">{{ titulo }}</h1>
            <p style="margin:0 0 20px; font-size:14.5px; line-height:1.6; color:#5b6b7a;">{{ mensagem }}</p>
            {% if detalhe %}
            <p style="margin:0 0 20px; padding:14px 16px; background:#f3f7f5; border-radius:10px; font-size:14px; line-height:1.6; color:#1f2d3d;">{{ detalhe }}</p>
            {% endif %}
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 32px; font-size:12px; color:#8a97a3;">
            Esta é uma mensagem automática da Tec Incubadora.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
