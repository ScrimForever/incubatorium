[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.162.7",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.16.3",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "resend>=2.54.0",
    "loguru>=0.8.0",
    "jinja2>=3.1.6",
    "alembic>=1.19.2",
    "aiofiles>=25.1.0",
    "fpdf2>=2.9.0",
    "sentry-sdk[asyncpg,fastapi,loguru,sqlalchemy]>=2.75.0",
]

[dependency-groups]
test = [
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.17.0",
    "aiosqlite>=0.22.1",
    "pypdf>=7.0.1",
]
dev = [
    {include-group = "test"},
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
    "locust>=2.46.5",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["domain*", "infra*", "repository*", "routers*", "services*", "shared*"]
