[project]
name = "src"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
    "resend>=2.42.0",
    "loguru>=0.7.3",
    "jinja2>=3.1.6",
    "alembic>=1.19.2",
    "aiofiles>=25.1.0",
    "opentelemetry-sdk>=1.45.1",
    "opentelemetry-exporter-otlp-proto-grpc>=1.45.1",
    "opentelemetry-instrumentation-fastapi>=0.66b1",
    "opentelemetry-instrumentation-sqlalchemy>=0.66b1",
    "opentelemetry-instrumentation-asyncpg>=0.66b1",
]

[dependency-groups]
test = [
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "aiosqlite>=0.22.1",
]
dev = [
    {include-group = "test"},
    "pre-commit>=4.6.2",
    "ruff>=0.16.5",
    "locust>=2.46.5",
]

[tool.ruff.lint]
ignore = ["B008"]

[tool.setuptools.packages.find]
include = ["domain*", "infra*", "repository*", "routers*", "services*", "shared*"]
