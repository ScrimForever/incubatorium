<main id="conteudo" tabindex="-1" class="auth-container">
  <div class="auth-card">
    <img class="auth-logo" src="logo.png" alt="TecCampos" width="584" height="162" />
    <h2 class="auth-titulo">Conta ativada</h2>
    <p class="auth-subtitulo">Seu e-mail foi verificado e seu cadastro está pronto.</p>

    <div class="success-message" role="status">
      <app-icone nome="sucesso" />
      Agora é só entrar com seu e-mail e senha.
    </div>

    <a class="btn btn--azul btn--block" [routerLink]="rotas.login">Ir para o login</a>
  </div>
</main>
